<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src data:; img-src https://*.sndcdn.com data:;">
<title>SixteenCloud Mini Player</title>
<link rel="stylesheet" href="../../../assets/fonts.css">
<style>
/* Theme tokens arrive from the main window (see MINI_THEME_TOKENS); these are
   the dark defaults until the first update. */
:root{
  --sc-bg:#0f0f10;--sc-surface:#151517;--sc-surface-raised:#1d1d20;
  --sc-text:#f2f2f4;--sc-text-muted:#8a8a90;--sc-text-subtle:#6a6a70;--sc-border:rgba(255,255,255,.07);
  --sc-accent:#ff5500;--sc-accent-hover:#ff6a1f;--sc-accent-foreground:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--sc-bg);overflow:hidden}
body{font-family:'Google Sans','Google Sans Text',-apple-system,'Segoe UI',Inter,sans-serif;color:var(--sc-text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;user-select:none}
.card{position:relative;isolation:isolate;display:flex;flex-direction:column;width:100%;height:100%;background:var(--sc-bg);overflow:hidden}
/* Blurred cover tint behind the card. */
.bg-art{position:absolute;inset:-40px;z-index:-1;background-size:cover;background-position:center;filter:blur(34px) saturate(1.4);opacity:0;transform:scale(1.1);transition:opacity .5s ease}
.card.has-art .bg-art{opacity:.32}
.card::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 0%,var(--sc-bg) 115%);pointer-events:none}
.header{position:relative;height:30px;flex-shrink:0;display:flex;align-items:center;padding-left:14px;border-bottom:1px solid var(--sc-border);-webkit-app-region:drag}
.header-title{flex:1;font-size:11px;font-weight:500;letter-spacing:.2px;color:var(--sc-text-muted);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win{display:flex;height:100%;-webkit-app-region:no-drag}
.win button{width:36px;height:100%;display:flex;align-items:center;justify-content:center;color:var(--sc-text-muted);transition:background .12s,color .12s}
.win button:hover{background:var(--sc-surface-raised);color:var(--sc-text)}
.win button.close:hover{background:#e81123;color:#fff}
.win svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.content{display:flex;flex-direction:column;flex:1;min-height:0;padding:10px 12px 10px 14px}
.top{display:flex;align-items:center;gap:12px;flex:1;min-height:0}
.art{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--sc-surface-raised);cursor:pointer;-webkit-app-region:no-drag;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sc-text-subtle)}
.ph svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.info{flex:1;min-width:0}
.title{font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;-webkit-app-region:no-drag}
.artist{font-size:11px;color:var(--sc-text-muted);line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;-webkit-app-region:no-drag}
.controls{display:flex;align-items:center;gap:1px;flex-shrink:0;-webkit-app-region:no-drag}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;outline:none;padding:0}
button:focus-visible{box-shadow:0 0 0 2px var(--sc-accent)}
.icon-btn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--sc-text-muted);transition:color .12s,background .12s}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{color:var(--sc-text);background:var(--sc-surface-raised)}
.icon-btn.small{width:24px;height:24px}
.icon-btn.small svg{width:15px;height:15px}
.like.on{color:var(--sc-accent)}
.like.on svg{fill:currentColor}
.play{width:34px;height:34px;border-radius:50%;margin:0 3px;display:flex;align-items:center;justify-content:center;color:var(--sc-accent-foreground);background:var(--sc-accent);transition:background .12s,transform .1s}
.play svg{width:22px;height:22px;fill:currentColor;stroke:none}
.play:hover{background:var(--sc-accent-hover)}
.play:active{transform:scale(.95)}
.bottom{display:flex;align-items:center;gap:8px;padding-top:8px;flex-shrink:0}
.time{font-size:9.5px;color:var(--sc-text-muted);font-variant-numeric:tabular-nums;min-width:26px;text-align:center}
.prog{flex:1;height:14px;display:flex;align-items:center;cursor:pointer;-webkit-app-region:no-drag;touch-action:none}
.track{position:relative;width:100%;height:2px;border-radius:1px;background:var(--sc-border)}
.fill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:1px;background:var(--sc-accent)}
.fill::after{content:'';position:absolute;right:-3px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--sc-text);transform:translateY(-50%) scale(0);transition:transform .1s}
.prog:hover .fill::after,.prog.dragging .fill::after{transform:translateY(-50%) scale(1)}
.vol{display:flex;align-items:center;gap:6px;flex-shrink:0;-webkit-app-region:no-drag}
.mute{width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--sc-text-muted);transition:color .12s}
.mute svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.mute:hover{color:var(--sc-text)}
.vol input{-webkit-appearance:none;appearance:none;width:56px;height:2px;border-radius:1px;outline:none;cursor:pointer;background:var(--sc-border)}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;background:var(--sc-text);border:0}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="bg-art" id="bgArt" aria-hidden="true"></div>
  <div class="header">
    <div class="header-title" id="headerTitle">Mini player</div>
    <div class="win">
      <button id="btnOpen" aria-label="Open SixteenCloud"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5"/><path d="M19 5l-8 8"/><path d="M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/></svg></button>
      <button id="btnHide" aria-label="Hide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button id="btnClose" class="close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
  </div>
  <div class="content">
    <div class="top">
      <div class="art" id="art" role="button" tabindex="0" aria-label="Open track page">
        <div class="ph" id="ph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg></div>
        <img id="artImg" alt="" style="display:none">
      </div>
      <div class="info">
        <div class="title" id="title"></div>
        <div class="artist" id="artist"></div>
      </div>
      <div class="controls">
        <button class="icon-btn small like" id="like" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg></button>
        <button class="icon-btn" id="prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14"/><path d="M19 5 9 12l10 7V5Z"/></svg></button>
        <button class="play" id="play"></button>
        <button class="icon-btn" id="next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14"/><path d="m5 5 10 7L5 19V5Z"/></svg></button>
        <button class="icon-btn small" id="lyrics"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"/><path d="M17 15v5"/><circle cx="15.5" cy="20" r="1.5"/></svg></button>
      </div>
    </div>
    <div class="bottom">
      <div class="time" id="tcur">0:00</div>
      <div class="prog" id="prog"><div class="track"><div class="fill" id="fill"></div></div></div>
      <div class="time" id="tdur">0:00</div>
      <div class="vol">
        <button class="mute" id="mute"><svg viewBox="0 0 24 24" aria-hidden="true" id="muteIcon"></svg></button>
        <input type="range" id="vol" min="0" max="100" value="100">
      </div>
    </div>
  </div>
</div>
<script src="mini-player.js"></script>
</body>
</html>
