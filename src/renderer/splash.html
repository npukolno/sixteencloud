<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:;">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .splash {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      border-radius: 12px;
    }
    .logo {
      width: 120px;
      height: 120px;
      opacity: 0;
      transform: scale(0.6);
      animation: logoIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }
    .text-logo {
      width: 220px;
      margin-top: 16px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.6s ease 0.5s forwards;
    }
    .spinner {
      width: 24px;
      height: 24px;
      margin-top: 28px;
      border: 2px solid #333;
      border-top-color: #f50;
      border-radius: 50%;
      opacity: 0;
      animation: fadeIn 0.4s ease 0.9s forwards, spin 0.7s linear 0.9s infinite;
    }
    @keyframes logoIn {
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .splash.fade-out {
      animation: splashOut 0.3s ease forwards;
    }
    @keyframes splashOut {
      to { opacity: 0; transform: scale(1.02); }
    }
  </style>
</head>
